services:
  - type: web
    name: present-foods-api
    env: node
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 18
      # Required: the server refuses to start without it.
      # Set the actual value in the Render dashboard — never in this file.
      - key: JWT_SECRET
        sync: false
