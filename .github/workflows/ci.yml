name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check all backend sources
        working-directory: backend
        run: find src -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Boot check (fails fast without JWT_SECRET, then starts cleanly with a placeholder)
        working-directory: backend
        env:
          JWT_SECRET: ci-placeholder-secret-not-used-for-real-traffic
        run: |
          node src/index.js &
          SERVER_PID=$!
          sleep 3
          curl --fail --silent http://localhost:5000/api/health || (kill $SERVER_PID; exit 1)
          kill $SERVER_PID

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
